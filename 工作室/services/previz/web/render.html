<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>预演渲染器（预演导演台 port）</title>
<style>
  html,body{margin:0;background:#0e1012;overflow:hidden}
  #stage{position:absolute;inset:0}
  #hud{position:fixed;left:8px;bottom:8px;color:#9da4ad;font:11px ui-monospace,monospace;z-index:9}
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud">renderer ready</div>
<script type="module">
/**
 * 预演导演台渲染核心 port（离线渲染用）
 *
 * 依据 REA/静态拆解自闭源商业软件（内部代号 *）导演台前端 index-CBJ_xqSO.js 的等价实现：
 *   - 元素构建 buildObject（box/sphere/cylinder/wall/mannequin/billboard/crowd）
 *   - 人物骨架 Sf（hips/spine/neck/shoulder{LR}/elbow{LR}/hip{LR}/knee{LR}）
 *   - 关节应用 Cf（弧度 = 度 * PI/180）
 *   - 相机 applyCameraPose / applyShot
 *   - 取景 captureShot（axis 比例表 16:9 9:16 4:3 1:1，toDataURL PNG）
 *
 * 与原版的差异：仅去掉交互（OrbitControls/gizmo/拾取）与 Tauri 保存，
 * 场景内容、几何参数、配色与取景逻辑保持一致。
 */
import * as THREE from './vendor/three.module.js';

const DEG = Math.PI / 180;
const ASPECT = { '16:9': 16 / 9, '9:16': 9 / 16, '4:3': 4 / 3, '1:1': 1 };

/* ---------------- 元素构建（对应原版 buildObject / Sf / kf） ---------------- */
function capsule(radius, length, mat) {
  const m = new THREE.Mesh(new THREE.CapsuleGeometry(radius, length, 4, 12), mat);
  m.position.y = -length / 2;
  return m;
}
/** 人物骨架：尺寸与原版 Sf 一致（按身高 n 归一） */
function buildMannequin(heightM, color) {
  const n = heightM;
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.75, metalness: 0.05 });
  const joints = {};
  const root = new THREE.Group();
  const J = (name, x, y, z, parent) => { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); joints[name] = g; return g; };

  const hips = J('hips', 0, 0.53 * n, 0, root);
  const pelvis = new THREE.Mesh(new THREE.SphereGeometry(0.075 * n, 12, 10), mat);
  pelvis.scale.set(1.25, 0.75, 0.9); hips.add(pelvis);

  const spine = J('spine', 0, 0.02 * n, 0, hips);
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.085 * n, 0.085 * n, 0.16 * n, 4, 12), mat);
  torso.position.y = 0.13 * n; spine.add(torso);

  const neck = J('neck', 0, 0.245 * n, 0, spine);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.068 * n, 14, 12), mat);
  head.position.y = 0.075 * n; neck.add(head);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.015 * n, 6, 6), mat);
  nose.position.set(0, 0.075 * n, 0.065 * n); neck.add(nose);

  for (const [side, sign] of [['L', -1], ['R', 1]]) {
    const sh = J(`shoulder${side}`, sign * 0.115 * n, 0.215 * n, 0, spine);
    sh.add(capsule(0.03 * n, 0.165 * n, mat));
    const el = J(`elbow${side}`, 0, -0.165 * n, 0, sh);
    el.add(capsule(0.026 * n, 0.15 * n, mat));
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.03 * n, 8, 8), mat);
    hand.position.y = -0.17 * n; el.add(hand);
  }
  for (const [side, sign] of [['L', -1], ['R', 1]]) {
    const hip = J(`hip${side}`, sign * 0.06 * n, -0.02 * n, 0, hips);
    hip.add(capsule(0.042 * n, 0.245 * n, mat));
    const knee = J(`knee${side}`, 0, -0.245 * n, 0, hip);
    knee.add(capsule(0.036 * n, 0.235 * n, mat));
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.055 * n, 0.03 * n, 0.12 * n), mat);
    foot.position.set(0, -0.25 * n, 0.035 * n); knee.add(foot);
  }
  root.userData.mannequin = { joints, material: mat };
  return root;
}
/** 应用关节旋转（对应原版 Cf）：输入角度制 */
function applyJoints(root, jd) {
  const m = root.userData.mannequin;
  if (!m) return;
  for (const g of Object.values(m.joints)) g.rotation.set(0, 0, 0);
  for (const [name, r] of Object.entries(jd || {})) {
    const g = m.joints[name];
    if (g && r) g.rotation.set((r.x || 0) * DEG, (r.y || 0) * DEG, (r.z || 0) * DEG);
  }
}
function buildObject(el) {
  const color = el.color || '#e1e3e7';
  switch (el.kind) {
    case 'box': return new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color, roughness: 0.8 }));
    case 'sphere': return new THREE.Mesh(new THREE.SphereGeometry(0.5, 20, 16), new THREE.MeshStandardMaterial({ color, roughness: 0.8 }));
    case 'cylinder': return new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1, 20), new THREE.MeshStandardMaterial({ color, roughness: 0.8 }));
    case 'wall': return new THREE.Mesh(new THREE.BoxGeometry(3, 2.4, 0.12), new THREE.MeshStandardMaterial({ color, roughness: 0.9 }));
    case 'mannequin': return buildMannequin(el.heightM || 1.75, color);
    case 'billboard': {
      const g = new THREE.Group(); g.userData.isBillboard = true;
      const h = el.heightM || 1.8;
      const panel = new THREE.Mesh(new THREE.PlaneGeometry(h * 0.55, h), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, alphaTest: 0.05, side: THREE.DoubleSide }));
      panel.position.y = h / 2; g.add(panel);
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, h, 8), new THREE.MeshStandardMaterial({ color, roughness: 0.8 }));
      stem.position.y = h / 2; g.add(stem);
      return g;
    }
    case 'crowd': {
      const g = new THREE.Group();
      const rows = el.rows || 3, cols = el.cols || 3, sp = el.spacing || 0.9;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const m = buildMannequin(1.75, color);
        m.position.set((c - (cols - 1) / 2) * sp, 0, (r - (rows - 1) / 2) * sp);
        g.add(m);
      }
      return g;
    }
    default: return new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color, roughness: 0.8 }));
  }
}

/* ---------------- 场景与相机 ---------------- */
const container = document.getElementById('stage');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1c20);

const shotCamera = new THREE.PerspectiveCamera(50, 16 / 9, 0.1, 500);
const orbitCamera = new THREE.PerspectiveCamera(50, 16 / 9, 0.1, 500);
orbitCamera.position.set(0, 2.5, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setPixelRatio(1);
renderer.setSize(container.clientWidth || 960, container.clientHeight || 540, false);
renderer.domElement.style.width = '100%';
renderer.domElement.style.height = '100%';
container.replaceChildren(renderer.domElement);

// 光照（灰模可读性）
scene.add(new THREE.HemisphereLight(0xffffff, 0x33383f, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(4, 8, 6); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(-5, 3, -4); scene.add(fill);

// 地面网格
const grid = new THREE.GridHelper(40, 40, 0x3a4048, 0x24282d);
grid.position.y = 0; scene.add(grid);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x212429, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.001; scene.add(ground);

/** 元素 id → Object3D */
const objects = new Map();
function syncElements(list) {
  const seen = new Set();
  for (const el of list) {
    seen.add(el.id);
    let obj = objects.get(el.id);
    const prev = obj?.userData.__src;
    const needsRebuild = !obj || !prev || prev.kind !== el.kind
      || (el.kind === 'mannequin' && (prev.heightM !== el.heightM || prev.color !== el.color))
      || (el.kind === 'crowd' && (prev.rows !== el.rows || prev.cols !== el.cols || prev.spacing !== el.spacing));
    if (needsRebuild) {
      if (obj) scene.remove(obj);
      obj = buildObject(el);
      obj.traverse((o) => { o.userData.elementId = el.id; });
      scene.add(obj); objects.set(el.id, obj);
    }
    obj.position.set(el.position.x, el.position.y, el.position.z);
    obj.rotation.set((el.rotationDeg?.x || 0) * DEG, (el.rotationDeg?.y || 0) * DEG, (el.rotationDeg?.z || 0) * DEG);
    obj.scale.set(el.scale?.x ?? 1, el.scale?.y ?? 1, el.scale?.z ?? 1);
    obj.visible = el.visible !== false;
    if (el.kind === 'mannequin') applyJoints(obj, el.joints);
    obj.userData.__src = { kind: el.kind, heightM: el.heightM, color: el.color, rows: el.rows, cols: el.cols, spacing: el.spacing };
  }
  for (const [id, obj] of [...objects]) if (!seen.has(id)) { scene.remove(obj); objects.delete(id); }
}
function applyCameraPose(cam) {
  shotCamera.position.set(cam.position.x, cam.position.y, cam.position.z);
  shotCamera.fov = cam.fov || 50;
  shotCamera.lookAt(new THREE.Vector3(cam.target.x, cam.target.y, cam.target.z));
  if (cam.rollDeg) shotCamera.rotateZ(-cam.rollDeg * DEG);
  shotCamera.updateProjectionMatrix();
}

/* ---------------- 取景（对应原版 captureShot / captureFrame） ---------------- */
function captureShot(aspect, longSide = 1600) {
  const r = ASPECT[aspect] || 16 / 9;
  // 长边固定，短边按比例（横屏长边=宽，竖屏长边=高）
  const w = r >= 1 ? longSide : Math.round(longSide * r);
  const h = r >= 1 ? Math.round(longSide / r) : longSide;
  const prevAspect = shotCamera.aspect, prevW = renderer.domElement.width, prevH = renderer.domElement.height;
  const gridVis = grid.visible, groundVis = ground.visible;
  try {
    grid.visible = false; ground.visible = false;
    renderer.setPixelRatio(1);
    renderer.setSize(w, h, false);
    shotCamera.aspect = r; shotCamera.updateProjectionMatrix();
    renderer.render(scene, shotCamera);
    return renderer.domElement.toDataURL('image/png');
  } finally {
    grid.visible = gridVis; ground.visible = groundVis;
    renderer.setSize(prevW, prevH, false);
    shotCamera.aspect = prevAspect; shotCamera.updateProjectionMatrix();
  }
}
function renderScene() {
  orbitCamera.aspect = (container.clientWidth || 16) / (container.clientHeight || 9);
  orbitCamera.updateProjectionMatrix();
  renderer.render(scene, shotCamera);
}
function loop() { requestAnimationFrame(loop); renderScene(); }
loop();

/* ---------------- 供 CDP 驱动的接口 ---------------- */
window.__PREVIZ__ = {
  ready: true,
  /** 载入一帧求值结果（{shot,camera,elements}） */
  apply(frame) {
    if (!frame) return false;
    applyCameraPose(frame.camera);
    syncElements(frame.elements || []);
    return true;
  },
  /** 载入 {timeSec, shot, camera, elements, fps} 序列的某一项 */
  applyAt(frames, timeSec) {
    const f = frames.find((x) => Math.abs(x.timeSec - timeSec) < 1e-3) || frames[0];
    return window.__PREVIZ__.apply(f);
  },
  capture(aspect, longSide) { return captureShot(aspect || '16:9', longSide || 1600); },
  info() {
    // 诊断：把实际用于建物的材质色/身高回读出来，供渲染验收核对
    // （BUG-1 验证：包里的 color/heightM 是否真的进了 MeshStandardMaterial，而不是回退默认灰）
    const materials = {};
    for (const [id, obj] of objects) {
      const src = obj.userData.__src || {};
      const mat = obj.userData.mannequin?.material;
      materials[id] = {
        kind: src.kind,
        color: mat ? '#' + mat.color.getHexString() : (src.color || null),
        heightM: src.heightM ?? null,
        rows: src.rows ?? null, cols: src.cols ?? null, spacing: src.spacing ?? null,
      };
    }
    return {
      objects: objects.size,
      elementIds: [...objects.keys()],
      materials,
      camera: {
        position: { x: shotCamera.position.x, y: shotCamera.position.y, z: shotCamera.position.z },
        fov: shotCamera.fov,
      },
      canvas: { width: renderer.domElement.width, height: renderer.domElement.height },
      three: THREE.REVISION,
    };
  },
  dispose() { renderer.dispose(); objects.clear(); },
};
document.getElementById('hud').textContent = 'renderer ready (three r' + THREE.REVISION + ')';
</script>
</body>
</html>
